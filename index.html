    <!-- Google Fonts -->

    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"

    <!-- Material Icons -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Lexend', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              serif: ['Newsreader', 'serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#1152d4',
                hover: '#0d42ab',
                light: '#e0eaff',
                dark: '#0a3a9e',
              },
              secondary: '#13ecec',
              background: {
                light: '#f6f6f8',
                dark: '#101622',
              },
              surface: {
                light: '#ffffff',
                dark: '#1a2234',
                darker: '#151b2b',
              },
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
            },
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: #334155;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
